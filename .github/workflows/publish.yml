name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    if: github.repository == 'DEVunderdog/DataForgeML'

    permissions:
      id-token: write   # required for OIDC trusted publisher
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv_build is the backend (pyproject.toml [build-system]). The wheel's
      # Requires-Dist still carries ranges, so the consumer contract is unchanged
      # -- only the machinery that produces the artifact moved to uv.
      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
