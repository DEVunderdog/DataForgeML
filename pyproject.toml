[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "dataforge-ml"
version = "3.3.0"
description = "A automated feature engineering and designing pipeline library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "scikit-learn>=1.9,<1.10",
    "numpy>=2.4,<2.6",
    "scipy>=1.17,<1.19",
    "joblib>=1.5,<1.7",
    "pydantic>=2.13,<2.14",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "chardet>=5.0.0",
    "iterative-stratification>=0.1.9",
    "diptest",
    "ruff>=0.16.0",
]

[project.scripts]
dataforge = "dataforge_ml._cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "tiktoken>=0.14",
]

[tool.uv]
required-version = ">=0.11"
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist); `-n 0` runs serially. See CONTRIBUTING.md.
addopts = "-n auto"
